      - Other
      - Particle size and count assay
      - Plasmid maintenance assay evidence
      - Quantitative PCR
      - Reporter gene assay
      - Substance quantification evidence
      - Transcript expression level evidence
      - Western blot assay
    broad_term_suggestions: >
